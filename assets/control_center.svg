<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>
  </defs>

  <style>
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #F8FAFC; }
    .card-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #94A3B8; letter-spacing: 0.05em; }
    .card-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; font-size: 12px; fill: #94A3B8; }
    .card-bullet { fill: #22C55E; }
    .header-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; fill: #64748B; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="878" height="258" rx="14" fill="#0A0A0C" stroke="#222227" stroke-width="1.5"/>

  <!-- Top bar header -->
  <text x="32" y="32" class="header-label">Модули Control Center</text>
  <line x1="32" y1="42" x2="848" y2="42" stroke="#1A1A20" stroke-width="1"/>

  <!-- CARD 1: Обзор -->
  <g transform="translate(32, 58)">
    <rect width="194" height="178" rx="10" fill="url(#cardBg)" stroke="#23232C" stroke-width="1.2"/>
    <rect x="14" y="14" width="60" height="18" rx="4" fill="#181822" stroke="#2A2A38" stroke-width="1"/>
    <text x="22" y="27" class="card-tag">STATUS</text>
    <text x="14" y="56" class="card-title">Обзор</text>
    <circle cx="20" cy="82" r="3" class="card-bullet"/>
    <text x="30" y="86" class="card-item">Hero-статус шлюза</text>
    <circle cx="20" cy="106" r="3" class="card-bullet"/>
    <text x="30" y="110" class="card-item">График задержки (RTT)</text>
    <circle cx="20" cy="130" r="3" class="card-bullet"/>
    <text x="30" y="134" class="card-item">Инспектор моделей</text>
    <circle cx="20" cy="154" r="3" class="card-bullet"/>
    <text x="30" y="158" class="card-item">Сторож Watchdog</text>
  </g>

  <!-- CARD 2: Прокси -->
  <g transform="translate(236, 58)">
    <rect width="194" height="178" rx="10" fill="url(#cardBg)" stroke="#23232C" stroke-width="1.2"/>
    <rect x="14" y="14" width="66" height="18" rx="4" fill="#181822" stroke="#2A2A38" stroke-width="1"/>
    <text x="22" y="27" class="card-tag">ROUTING</text>
    <text x="14" y="56" class="card-title">Прокси</text>
    <circle cx="20" cy="82" r="3" class="card-bullet"/>
    <text x="30" y="86" class="card-item">Multi-Proxy Racing</text>
    <circle cx="20" cy="106" r="3" class="card-bullet"/>
    <text x="30" y="110" class="card-item">Менеджер пресетов</text>
    <circle cx="20" cy="130" r="3" class="card-bullet"/>
    <text x="30" y="134" class="card-item">Экспорт CLI (PowerShell)</text>
    <circle cx="20" cy="154" r="3" class="card-bullet"/>
    <text x="30" y="158" class="card-item">Запуск терминала</text>
  </g>

  <!-- CARD 3: Диагностика -->
  <g transform="translate(440, 58)">
    <rect width="194" height="178" rx="10" fill="url(#cardBg)" stroke="#23232C" stroke-width="1.2"/>
    <rect x="14" y="14" width="60" height="18" rx="4" fill="#181822" stroke="#2A2A38" stroke-width="1"/>
    <text x="22" y="27" class="card-tag">DOCTOR</text>
    <text x="14" y="56" class="card-title">Диагностика</text>
    <circle cx="20" cy="82" r="3" class="card-bullet"/>
    <text x="30" y="86" class="card-item">Проверка Language Server</text>
    <circle cx="20" cy="106" r="3" class="card-bullet"/>
    <text x="30" y="110" class="card-item">Статус локального порта</text>
    <circle cx="20" cy="130" r="3" class="card-bullet"/>
    <text x="30" y="134" class="card-item">DNS и NRPT правила</text>
    <circle cx="20" cy="154" r="3" class="card-bullet"/>
    <text x="30" y="158" class="card-item">Отчёт неполадок</text>
  </g>

  <!-- CARD 4: Журнал -->
  <g transform="translate(644, 58)">
    <rect width="204" height="178" rx="10" fill="url(#cardBg)" stroke="#23232C" stroke-width="1.2"/>
    <rect x="14" y="14" width="68" height="18" rx="4" fill="#181822" stroke="#2A2A38" stroke-width="1"/>
    <text x="22" y="27" class="card-tag">LOGGING</text>
    <text x="14" y="56" class="card-title">Журнал</text>
    <circle cx="20" cy="82" r="3" class="card-bullet"/>
    <text x="30" y="86" class="card-item">Адаптивный терминал</text>
    <circle cx="20" cy="106" r="3" class="card-bullet"/>
    <text x="30" y="110" class="card-item">Цветовая подсветка</text>
    <circle cx="20" cy="130" r="3" class="card-bullet"/>
    <text x="30" y="134" class="card-item">Копирование в 1 клик</text>
    <circle cx="20" cy="154" r="3" class="card-bullet"/>
    <text x="30" y="158" class="card-item">Автоскролл событий</text>
  </g>
</svg>
