<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15151B"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>
    <linearGradient id="directGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121217"/>
      <stop offset="100%" stop-color="#0B0B0E"/>
    </linearGradient>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22C55E"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; font-size: 11.5px; fill: #94A3B8; }
    .meta { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #64748B; }
    .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #22C55E; font-weight: 700; }
    .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; fill: #64748B; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 11px; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="878" height="298" rx="14" fill="#0A0A0C" stroke="#222227" stroke-width="1.5"/>

  <!-- Top bar header -->
  <text x="36" y="32" class="header-text">Избирательная маршрутизация Open Antigravity</text>
  <line x1="36" y1="42" x2="844" y2="42" stroke="#1A1A20" stroke-width="1"/>

  <!-- NODE 1: Google Antigravity -->
  <g transform="translate(36, 62)">
    <rect width="194" height="116" rx="10" fill="url(#cardGrad)" stroke="#252530" stroke-width="1.2"/>
    <circle cx="24" cy="30" r="4.5" fill="#3B82F6"/>
    <text x="36" y="34" class="title">Google Antigravity</text>
    <text x="20" y="58" class="subtitle">IDE и Language Server</text>
    <rect x="20" y="74" width="154" height="22" rx="4" fill="#181822" stroke="#262634" stroke-width="1"/>
    <text x="28" y="89" class="meta">OAG_GATEWAY: :45318</text>
  </g>

  <!-- Connection 1 -> 2 (100px gap: 230 to 330) -->
  <line x1="230" y1="120" x2="324" y2="120" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowWhite)"/>
  <rect x="246" y="94" width="68" height="18" rx="4" fill="#14141A" stroke="#252532" stroke-width="1"/>
  <text x="280" y="107" text-anchor="middle" class="pill-text" fill="#94A3B8">AI трафик</text>

  <!-- NODE 2: Open Antigravity Gateway -->
  <g transform="translate(330, 54)">
    <rect width="220" height="132" rx="12" fill="url(#cardGrad)" stroke="#383848" stroke-width="1.5"/>
    <rect x="16" y="14" width="56" height="17" rx="3" fill="#052E16" stroke="#166534" stroke-width="1"/>
    <text x="44" y="26" text-anchor="middle" class="badge">ACTIVE</text>
    <text x="16" y="52" class="title">Open Antigravity</text>
    <text x="16" y="70" class="subtitle">Локальный шлюз и DNS-слой</text>
    <line x1="16" y1="82" x2="204" y2="82" stroke="#202028" stroke-width="1"/>
    <text x="16" y="99" class="meta">127.0.0.1:45318</text>
    <text x="16" y="115" class="meta">Failover &amp; RTT Racing</text>
  </g>

  <!-- Connection 2 -> 3 (100px gap: 550 to 650) -->
  <line x1="550" y1="120" x2="642" y2="120" stroke="#22C55E" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <rect x="564" y="94" width="72" height="18" rx="4" fill="#0A2518" stroke="#166534" stroke-width="1"/>
  <text x="600" y="107" text-anchor="middle" class="pill-text" fill="#22C55E">VPS прокси</text>

  <!-- NODE 3: Google AI Models Cloud -->
  <g transform="translate(650, 62)">
    <rect width="194" height="116" rx="10" fill="url(#cardGrad)" stroke="#252530" stroke-width="1.2"/>
    <circle cx="24" cy="30" r="4.5" fill="#22C55E"/>
    <text x="36" y="34" class="title">Google AI Cloud</text>
    <text x="20" y="58" class="subtitle">Gemini 2.0 / Code API</text>
    <rect x="18" y="74" width="158" height="22" rx="4" fill="#181822" stroke="#262634" stroke-width="1"/>
    <text x="24" y="89" class="meta">cloudcode-pa.googleapis</text>
  </g>

  <!-- Bottom Row: Direct System Traffic -->
  <g transform="translate(36, 204)">
    <rect width="808" height="74" rx="10" fill="url(#directGrad)" stroke="#1F1F27" stroke-width="1.2"/>
    
    <g transform="translate(20, 20)">
      <circle cx="12" cy="12" r="4" fill="#64748B"/>
      <text x="26" y="16" class="title" font-size="13.5px">Браузер, Git, Консоль, Загрузки и Игры</text>
      <text x="26" y="35" class="subtitle">Прямое подключение к интернету на полной скорости вашего провайдера</text>
    </g>

    <g transform="translate(616, 20)">
      <rect width="172" height="34" rx="6" fill="#14141A" stroke="#252530" stroke-width="1"/>
      <circle cx="16" cy="17" r="3.5" fill="#22C55E"/>
      <text x="28" y="21" class="meta" fill="#F8FAFC">Без VPN · Скорость 100%</text>
    </g>
  </g>
</svg>
