<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16161C"/>
      <stop offset="100%" stop-color="#0F0F13"/>
    </linearGradient>
    <linearGradient id="directGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121217"/>
      <stop offset="100%" stop-color="#0C0C10"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22C55E"/>
    </marker>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F8FAFC"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 12px; fill: #94A3B8; }
    .meta { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #64748B; }
    .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #22C55E; font-weight: 600; }
    .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; fill: #64748B; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="878" height="338" rx="14" fill="#0A0A0C" stroke="#222227" stroke-width="1.5"/>

  <!-- Top bar header -->
  <text x="32" y="36" class="header-text">Архитектура избирательной маршрутизации Open Antigravity</text>
  <line x1="32" y1="48" x2="848" y2="48" stroke="#1A1A20" stroke-width="1"/>

  <!-- NODE 1: Google Antigravity -->
  <g transform="translate(32, 74)">
    <rect width="210" height="110" rx="10" fill="url(#cardGrad)" stroke="#272730" stroke-width="1.2"/>
    <circle cx="28" cy="32" r="5" fill="#3B82F6"/>
    <text x="42" y="36" class="title">Google Antigravity</text>
    <text x="24" y="62" class="subtitle">IDE и Language Server</text>
    <rect x="24" y="74" width="162" height="22" rx="4" fill="#181822" stroke="#252533" stroke-width="1"/>
    <text x="32" y="89" class="meta">OAG_GATEWAY: :45318</text>
  </g>

  <!-- Connection 1 -> 2 -->
  <line x1="242" y1="129" x2="310" y2="129" stroke="#F8FAFC" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowWhite)"/>
  <text x="276" y="120" text-anchor="middle" class="meta">AI трафик</text>

  <!-- NODE 2: Open Antigravity Gateway -->
  <g transform="translate(318, 64)">
    <rect width="244" height="130" rx="12" fill="url(#cardGrad)" stroke="#383848" stroke-width="1.6"/>
    <rect x="18" y="14" width="68" height="18" rx="4" fill="#052E16" stroke="#166534" stroke-width="1"/>
    <text x="25" y="27" class="badge">ACTIVE</text>
    <text x="18" y="54" class="title">Open Antigravity</text>
    <text x="18" y="74" class="subtitle">Локальный шлюз и DNS-слой</text>
    <line x1="18" y1="86" x2="226" y2="86" stroke="#22222C" stroke-width="1"/>
    <text x="18" y="104" class="meta">HTTP / CONNECT · 127.0.0.1:45318</text>
    <text x="18" y="120" class="meta">Автоматический Failover &amp; RTT Ping</text>
  </g>

  <!-- Connection 2 -> 3 -->
  <line x1="562" y1="129" x2="630" y2="129" stroke="#22C55E" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="596" y="120" text-anchor="middle" class="meta" fill="#22C55E">Зарубежный VPS</text>

  <!-- NODE 3: Google AI Models Cloud -->
  <g transform="translate(638, 74)">
    <rect width="210" height="110" rx="10" fill="url(#cardGrad)" stroke="#272730" stroke-width="1.2"/>
    <circle cx="28" cy="32" r="5" fill="#22C55E"/>
    <text x="42" y="36" class="title">Google AI Cloud</text>
    <text x="24" y="62" class="subtitle">Gemini 2.0 / Code Assist</text>
    <rect x="24" y="74" width="162" height="22" rx="4" fill="#181822" stroke="#252533" stroke-width="1"/>
    <text x="32" y="89" class="meta">daily-cloudcode-pa.googleapis.com</text>
  </g>

  <!-- Direct Route Row: System Apps & Browser -->
  <g transform="translate(32, 224)">
    <rect width="816" height="88" rx="10" fill="url(#directGrad)" stroke="#1F1F26" stroke-width="1.2"/>
    
    <g transform="translate(24, 24)">
      <circle cx="16" cy="18" r="4" fill="#64748B"/>
      <text x="32" y="22" class="title" font-size="14px">Браузер, Git, Консоль, Загрузки и Игры</text>
      <text x="32" y="44" class="subtitle">Прямое подключение к интернету на полной скорости вашего провайдера</text>
    </g>

    <g transform="translate(560, 26)">
      <rect width="232" height="34" rx="6" fill="#14141A" stroke="#262632" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#22C55E"/>
      <text x="30" y="21" class="meta" fill="#F8FAFC">Без VPN · Скорость 100%</text>
    </g>
  </g>
</svg>
