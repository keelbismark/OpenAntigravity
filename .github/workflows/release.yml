name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.17.0.3)'
        required: false
        type: string
      notes:
        description: 'Release notes'
        required: false
        type: string

permissions:
  contents: write

# One release per tag at a time. A tag can be pushed twice (a corrective
# force-push, for instance); without this, two full builds race to upload the
# same assets. `check-release` below skips a repeat entirely.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-release:
    name: Check release tag and existing release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          elif [ -f VERSION ]; then
            V="$(tr -d '\r\n' < VERSION)"
          else
            echo "Error: VERSION file not found" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"

      - name: Validate tag against version files
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          # A tag pushed at the wrong commit would publish artifacts named
          # after a version the build never produced. Fail before spending
          # twenty minutes building them.
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "Tag v${TAG} does not match VERSION=${VERSION}" >&2
              exit 1
            fi
          fi
          CARGO_VERSION="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)"
          if [ -n "$CARGO_VERSION" ] && [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "Cargo.toml version ${CARGO_VERSION} does not match VERSION=${VERSION}" >&2
            exit 1
          fi
          echo "Tag and version files agree: ${VERSION}"

      - name: Skip if this release is already published
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          # A force-pushed tag retriggers this workflow. Rebuilding and
          # re-uploading identical assets wastes twenty minutes and can race
          # the first run. Skip only when every asset is already there - a
          # half-published release still needs a full run.
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ASSETS="$(gh release view "v${VERSION}" --json assets -q '.assets[].name' 2>/dev/null || true)"
          MISSING=0
          for f in \
            "OpenAntigravity_windows_v${VERSION}_setup.exe" \
            "OpenAntigravity_windows_v${VERSION}_portable.zip" \
            "OpenAntigravity_linux_v${VERSION}.tar.gz" \
            "OpenAntigravity-x86_64.AppImage" \
            "version.json" \
            "SHA256SUMS.txt"; do
            printf '%s\n' "$ASSETS" | grep -qx "$f" || MISSING=1
          done
          if [ "$MISSING" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} is complete - skipping rebuild and publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} exists but is incomplete - rebuilding."
          fi

  build-linux:
    needs: check-release
    if: needs.check-release.outputs.exists != 'true'
    name: Build Linux Portable & AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          elif [ -f VERSION ]; then
            V="$(tr -d '\r\n' < VERSION)"
          else
            echo "Error: VERSION file not found" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          echo "Building Linux version: $V"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libfuse2 \
            ffmpeg \
            curl

      - name: Build portable Linux distribution
        env:
          OAG_MUSL: "0"
          OAG_PORTABLE: "1"
          OAG_FULL_VERSION: ${{ steps.ver.outputs.VERSION }}
          # Secret is still stored under the old name in repo settings (backwards compatibility).
          OAG_BUILTIN_PROXY: ${{ secrets.AG_BUILTIN_PROXY }}
          OAG_UPDATE_URL: "https://keelbismark.github.io/OpenAntigravity/version.json"
        run: |
          bash build_portable.sh

      - name: Package Linux release & AppImage
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          bash package_release.sh --skip-build --version "$VERSION"
          bash build_appimage.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            release/OpenAntigravity_linux_v*.tar.gz
            release/OpenAntigravity*.AppImage

  build-windows:
    name: Build Windows Portable
    needs: check-release
    if: needs.check-release.outputs.exists != 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          elif [ -f VERSION ]; then
            V="$(tr -d '\r\n' < VERSION)"
          else
            echo "Error: VERSION file not found" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          echo "Building Windows version: $V"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Build & Package Windows Distributions (Setup & Portable)
        shell: cmd
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          OAG_FULL_VERSION: ${{ steps.ver.outputs.VERSION }}
          # Secret is still stored under the old name in repo settings (backwards compatibility).
          OAG_BUILTIN_PROXY: ${{ secrets.AG_BUILTIN_PROXY }}
          OAG_UPDATE_URL: "https://keelbismark.github.io/OpenAntigravity/version.json"
        run: |
          call build.cmd --package

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            release/OpenAntigravity_windows_v*_setup.exe
            release/OpenAntigravity_windows_v*_portable.zip

  publish-release:
    name: Publish GitHub Release
    needs: [check-release, build-linux, build-windows]
    if: needs.check-release.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          elif [ -f VERSION ]; then
            V="$(tr -d '\r\n' < VERSION)"
          else
            echo "Error: VERSION file not found" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files and version.json
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist_release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*_portable.zip" -o -name "*.AppImage" -o -name "*_setup.exe" \) -exec cp {} dist_release/ \;

          TAG="v${VERSION}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          DL_URL="https://github.com/${REPO}/releases/download/${TAG}"

          cd dist_release
          sha256sum OpenAntigravity_windows_v${VERSION}_setup.exe \
                    OpenAntigravity_windows_v${VERSION}_portable.zip \
                    OpenAntigravity-x86_64.AppImage \
                    OpenAntigravity_linux_v${VERSION}.tar.gz > SHA256SUMS.txt 2>/dev/null || true

          SHA_WIN_PORT=$(sha256sum OpenAntigravity_windows_v${VERSION}_portable.zip 2>/dev/null | awk '{print $1}' || echo "")
          SHA_WIN_SETUP=$(sha256sum OpenAntigravity_windows_v${VERSION}_setup.exe 2>/dev/null | awk '{print $1}' || echo "")
          SHA_LINUX=$(sha256sum OpenAntigravity_linux_v${VERSION}.tar.gz 2>/dev/null | awk '{print $1}' || echo "")
          SHA_APPIMAGE=$(sha256sum OpenAntigravity-x86_64.AppImage 2>/dev/null | awk '{print $1}' || echo "")

          cat > version.json <<ENDJSON
          {
            "version": "${VERSION}",
            "notes": "Open Antigravity v${VERSION}",
            "page": "${RELEASE_URL}",
            "url_windows": "${DL_URL}/OpenAntigravity_windows_v${VERSION}_portable.zip",
            "url_windows_setup": "${DL_URL}/OpenAntigravity_windows_v${VERSION}_setup.exe",
            "url_windows_portable": "${DL_URL}/OpenAntigravity_windows_v${VERSION}_portable.zip",
            "url_linux": "${DL_URL}/OpenAntigravity_linux_v${VERSION}.tar.gz",
            "url_appimage": "${DL_URL}/OpenAntigravity-x86_64.AppImage",
            "sha256_windows": "${SHA_WIN_PORT}",
            "sha256_linux": "${SHA_LINUX}",
            "sha256_appimage": "${SHA_APPIMAGE}"
          }
          ENDJSON

          # Сбор списка изменений из Conventional Commits
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS_RANGE="${PREV_TAG}..HEAD"
          else
            COMMITS_RANGE="HEAD~15..HEAD"
          fi

          FEATS=$(git log $COMMITS_RANGE --grep="^feat" --pretty=format:"- %s" 2>/dev/null || true)
          FIXES=$(git log $COMMITS_RANGE --grep="^fix" --pretty=format:"- %s" 2>/dev/null || true)
          OTHER=$(git log $COMMITS_RANGE --grep="^\(chore\|docs\|refactor\|perf\)" --pretty=format:"- %s" 2>/dev/null | grep -Ev "chore\(release\)|bump version" || true)

          CHANGELOG=""
          if [ -n "$FEATS" ]; then
            CHANGELOG=$(printf "%s\n\n### 🚀 Новые возможности\n%s" "$CHANGELOG" "$FEATS")
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG=$(printf "%s\n\n### 🐛 Исправления ошибок\n%s" "$CHANGELOG" "$FIXES")
          fi
          if [ -n "$OTHER" ]; then
            CHANGELOG=$(printf "%s\n\n### 🔧 Улучшения и оптимизации\n%s" "$CHANGELOG" "$OTHER")
          fi

          {
            echo "## Open Antigravity v${VERSION}"
            echo ""
            echo "Портативная модифицированная сборка для Antigravity (Google IDE)."
            echo ""
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
              echo ""
            fi
            echo "### 📦 Скачать сборку"
            echo "- 🪟 **Windows (установщик .exe):** [OpenAntigravity_windows_v${VERSION}_setup.exe](${DL_URL}/OpenAntigravity_windows_v${VERSION}_setup.exe)"
            echo "- 🪟 **Windows (портативная версия в data/):** [OpenAntigravity_windows_v${VERSION}_portable.zip](${DL_URL}/OpenAntigravity_windows_v${VERSION}_portable.zip)"
            echo "- 🐧 **Linux (AppImage, рекомендуется для Steam Deck / Ubuntu / Fedora):** [OpenAntigravity-x86_64.AppImage](${DL_URL}/OpenAntigravity-x86_64.AppImage)"
            echo "- 🐧 **Linux (архив .tar.gz):** [OpenAntigravity_linux_v${VERSION}.tar.gz](${DL_URL}/OpenAntigravity_linux_v${VERSION}.tar.gz)"
            echo ""
            echo "### 🚀 Особенности"
            echo "- **Избирательное проксирование:** через прокси идут только вызовы моделей Google, остальной трафик системы и IDE не затрагивается."
            echo "- **Свой прокси:** поддержка формата \`логин:пароль@хост:порт\` или цепочки резервирования \`основной;резервный\`."
            echo "- **Полная портативность:** все настройки хранятся в каталоге \`data/\` рядом с приложением."
            echo "- **Поддержка Steam Deck:** готовый AppImage и портативная сборка со встроенной иконкой и адаптивным интерфейсом."
            echo "- **Двойной интерфейс:** современный графический интерфейс (GUI) + терминальный текстовый режим (TUI)."
            echo ""
            echo "### 🔒 Контрольные суммы (SHA256)"
            echo "\`\`\`"
            cat SHA256SUMS.txt
            echo "\`\`\`"
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}
          name: Open Antigravity v${{ steps.ver.outputs.VERSION }}
          body_path: dist_release/RELEASE_NOTES.md
          files: |
            dist_release/OpenAntigravity_windows_v${{ steps.ver.outputs.VERSION }}_setup.exe
            dist_release/OpenAntigravity_windows_v${{ steps.ver.outputs.VERSION }}_portable.zip
            dist_release/OpenAntigravity-x86_64.AppImage
            dist_release/OpenAntigravity_linux_v${{ steps.ver.outputs.VERSION }}.tar.gz
            dist_release/version.json
            dist_release/SHA256SUMS.txt

      - name: Sync version files, docs, and index.html
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          # This job checks out a detached tag, and main may have moved since
          # that tag was created - the previous release's docs sync is exactly
          # that case. Apply the generated files on top of the real main, never
          # on the tag's tree, or the push is rejected as non-fast-forward.
          git fetch origin main
          git checkout -B release-docs-sync origin/main

          cp dist_release/version.json docs/version.json
          echo "${VERSION}" > VERSION
          sed -i -E "s/v[0-9]+\.[0-9]+\.[0-9]+/v${VERSION}/g" docs/index.html
          sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"${VERSION}\"/" Cargo.toml
          if ! cargo update -p open_antigravity --precise "${VERSION}" 2>/dev/null; then
            echo "Cargo.lock version refresh skipped - the feed does not depend on it."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/version.json docs/index.html VERSION Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "Version files and docs are already current - nothing to commit."
          else
            git commit -m "chore(release): sync update feed and docs to v${VERSION}"
          fi

          # Deliberately no `|| true` here. A rejected push leaves the live feed
          # pointing at the old release - that is a failed release and must be
          # reported as one, not swallowed by a green job.
          git push origin release-docs-sync:main
